document.addEventListener('DOMContentLoaded', async function() {

  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lor: #f8fafc\">\n      <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 700; letter-spacing: 0.02em; color: #f8fafc\">Lawrence Liquornik<\u002Fspan>\n      <span style=\"font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: {{ accent }}; font-weight: 600\">Criminal &amp; Family Lawyer<\u002Fspan>\n    <\u002Fa>\n    <div style=\"display: flex; align-items: center; gap: 26px; flex-wrap: wrap\">\n      <a href=\"#about\" style=\"color: #cbd5e1; font-size: 14px; font-weight: 500\" style-hover=\"color: #ffffff\">About<\u002Fa>\n      <a href=\"#practice\" style=\"color: #cbd5e1; font-size: 14px; font-weight: 500\" style-hover=\"color: #ffffff\">Practice Areas<\u002Fa>\n      <a href=\"#experience\" style=\"color: #cbd5e1; font-size: 14px; font-weight: 500\" style-hover=\"color: #ffffff\">Experience<\u002Fa>\n      <a href=\"#contact\" style=\"background: {{ accent }}; color: #ffffff; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 3px\" style-hover=\"background: #92400e; color: #ffffff\">Contact<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fnav>\n<\u002Fheader>\n\n<!-- HERO -->\n<section id=\"top\" style=\"background: linear-gradient(160deg, #0f172a 0%, #1e293b 70%, #1e3a5f 100%); color: #f8fafc; padding: 96px 24px 104px; position: relative; overflow: hidden\">\n  <div style=\"position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 20%, rgba(180,83,9,0.12), transparent 55%)\"><\u002Fdiv>\n  <div aria-hidden=\"true\" style=\"position: absolute; left: 50%; top: 50%; transform: translate(-32%, -50%); width: clamp(300px, 36vw, 470px); aspect-ratio: 400 / 460; opacity: 0.12; pointer-events: none; background-repeat: no-repeat; background-size: contain; background-position: center; -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 16%, black 80%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0%, black 16%, black 80%, transparent 100%); background-im vg>\n        <span style=\"font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: rgb(217, 160, 102); font-weight: 600;\">Serving the Greater Toronto Area AND ACROSS ONTARIO<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(38px, 5vw, 58px); font-weight: 600; line-height: 1.12; margin: 0; text-wrap: pretty\">More than 34 years practicing both <em style=\"font-style: italic; color: #e8b06b\">Family Law<\u002Fem> and <em style=\"font-style: italic; color: #e8b06b\">Criminal Law<\u002Fem> in the GTA.<\u002Fh1>\n      <p style=\"font-size: 18px; line-height: 1.65; color: #cbd5e1; margin: 0; max-width: 56ch; text-wrap: pretty\">Family disputes and criminal allegations often go hand-in-hand — a domestic transition can suddenly intersect with criminal charges. Lawrence Liquornik is one of the few GTA lawyers truly proficient in both fields, giving his clients a distinct tactical advantage when it matters most.<\u002Fp>\n      <div style=\"display: flex; gap: 16px; flex-wrap: wrap; align-items: center\">\n        <a href=\"#contact\" style=\"display: inline-flex; align-items: center; gap: 10px; background: {{ accent }}; color: #ffffff; font-size: 16px; font-weight: 600; padding: 15px 30px; border-radius: 3px; box-shadow: 0 8px 24px rgba(180,83,9,0.35)\" style-hover=\"background: #92400e; color: #ffffff; transform: translateY(-1px)\">Schedule a Consultation <i data-lucide=\"arrow-right\" style=\"width: 17px; height: 17px\"><\u002Fi><\u002Fa>\n        <a href=\"#practice\" style=\"display: inline-flex; align-items: center; gap: 8px; color: #cbd5e1; font-size: 15px; font-weight: 500; padding: 15px 8px\" style-hover=\"color: #ffffff\">Explore practice areas<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv><div style=\"display: flex; flex-direction: column; gap: 1px; background: rgba(180,83,9,0.35); border: 1px solid rgba(180,83,9,0.35); border-radius: 4px; overflow: hidden; opacity: 1; position: absolute; left: 842px; top: 118px\">\n      <div style=\"background: rgba(15,23,42,0.85); padding: 24px 26px; display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 700; color: #e8b06b; line-height: 1\">34+<\u002Fspan>\n        <span style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #94a3b8; font-weight: 600\">YEARS OF EXPERIENCE<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: rgba(15,23,42,0.85); padding: 24px 26px; display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 700; color: #e8b06b; line-height: 1\">25<\u002Fspan>\n        <span style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #94a3b8; font-weight: 600\">Years as part-time Crown Attorney<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background: rgba(15,23,42,0.85); padding: 24px 26px; display: flex; flex-direction: column; gap: 4px\">\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 700; color: #e8b06b; line-height: 1\">2<\u002Fspan>\n        <span style=\"font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #94a3b8; font-weight: 600\">FIELDS, PROFICIENCY IN BOTH<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    \n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ABOUT / EXPERIENCE -->\n<section id=\"about\" style=\"padding: 96px 24px; background: #fbfaf8\">\n  <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 56px\">\n    <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px\">\n      <span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: {{ accent }}; font-weight: 700\">Professional Background<\u002Fspan>\n      <h2 id=\"experience\" style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(30px, 3.6vw, 42px); font-weight: 600; margin: 0; color: #0f172a; text-wrap: pretty\">Experience earned on both sides of the courtroom.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 28px\">\n      <article style=\"background: #ffffff; border: 1px solid #e7e2d9; border-top: 3px solid {{ accent }}; border-radius: 4px; padding: 34px 30px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 3px rgba(15,23,42,0.05)\">\n        <i data-lucide=\"landmark\" style=\"width: 28px; height: 28px; color: {{ accent }}\"><\u002Fi>\n        <h3 style=\"font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 700; margin: 0; color: #0f172a\">25 Years as a Part-Time Crown Attorney<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 1.7; color: #475569; margin: 0; text-wrap: pretty\">A quarter-century prosecuting for the Crown provides unparalleled insight into the Ontario court system and prosecutorial strategy. When Lawrence defends you, he knows precisely how the other side thinks.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"background: #ffffff; border: 1px solid #e7e2d9; border-top: 3px solid {{ accent }}; border-radius: 4px; padding: 34px 30px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 3px rgba(15,23,42,0.05)\">\n        <i data-lucide=\"gavel\" style=\"width: 28px; height: 28px; color: {{ accent }}\"><\u002Fi>\n        <h3 style=\"font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 700; margin: 0; color: #0f172a\">Extensive Litigation &amp; Courtroom Experience<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 1.7; color: #475569; margin: 0; text-wrap: pretty\">Decades of trial work across the GTA mean that Lawrence is a seasoned litigator with an excellent track record.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"background: #ffffff; border: 1px solid #e7e2d9; border-top: 3px solid {{ accent }}; border-radius: 4px; padding: 34px 30px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 3px rgba(15,23,42,0.05)\">\n        <i data-lucide=\"handshake\" style=\"width: 28px; height: 28px; color: {{ accent }}\"><\u002Fi>\n        <h3 style=\"font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 700; margin: 0; color: #0f172a\">Resolution First in Family Matters<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 1.7; color: #475569; margin: 0; text-wrap: pretty\">Extensive litigation experience, but strictly oriented towards resolution in family law cases wherever possible — protecting families, children, and assets from the cost and emotional toll of unnecessary court battles.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- PRACTICE AREAS -->\n<section id=\"practice\" style=\"padding: 96px 24px; background: #f2efe9; border-top: 1px solid #e7e2d9; border-bottom: 1px solid #e7e2d9\">\n  <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n    <div style=\"display: flex; flex-direction: column; gap: 14px; max-width: 720px\">\n      <span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: {{ accent }}; font-weight: 700\">Practice Areas<\u002Fspan>\n      <h2 style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(30px, 3.6vw, 42px); font-weight: 600; margin: 0; color: #0f172a; text-wrap: pretty\">Two disciplines. One advocate.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 28px\">\n      <article style=\"background: #0f172a; color: #f8fafc; border-radius: 4px; padding: 40px 34px; display: flex; flex-direction: column; gap: 16px\">\n        <div style=\"display: flex; align-items: center; gap: 12px\">\n          <i data-lucide=\"shield\" style=\"width: 26px; height: 26px; color: #e8b06b\"><\u002Fi>\n          <h3 style=\"font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 700; margin: 0\">Criminal Defence<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"font-size: 15.5px; line-height: 1.7; color: #cbd5e1; margin: 0; text-wrap: pretty\">Robust, strategic defence backed by a former prosecutor's perspective. From bail hearings to trial, every stage is approached with insider knowledge of how the Crown builds its case, and how to weaken it.<\u002Fp>\n        <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; color: #94a3b8\">\n          <li style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"color: #e8b06b\">—<\u002Fspan> Assault &amp; domestic allegations<\u002Fli>\n          <li style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"color: rgb(232, 176, 107);\">—<\u002Fspan> Impaired driving<\u002Fli>\n          <li style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"color: rgb(232, 176, 107);\">—<\u002Fspan>Firearms charges<\u002Fli>\n          <li style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"color: rgb(232, 176, 107);\">—<\u002Fspan> Bail hearings&nbsp;<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n      <article style=\"background: #ffffff; border: 1px solid #e7e2d9; border-radius: 4px; padding: 40px 34px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 3px rgba(15,23,42,0.05)\">\n        <div style=\"display: flex; align-items: center; gap: 12px\">\n          <i data-lucide=\"users\" style=\"width: 26px; height: 26px; color: {{ accent }}\"><\u002Fi>\n          <h3 style=\"font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 700; margin: 0; color: #0f172a\">Family Law<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"font-size: 15.5px; line-height: 1.7; color: #475569; margin: 0; text-wrap: pretty\">Compassionate, resolution-oriented guidance through life's most difficult transitions — with the litigation strength to protect you fully if negotiation fails.<\u002Fp>\n        <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; color: #64748b\">\n          <li style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"color: {{ accent }}\">—<\u002Fspan> Divorce &amp; separation<\u002Fli>\n          <li style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"color: rgb(180, 83, 9);\">—<\u002Fspan> Access &amp; parenting plans<\u002Fli>\n          <li style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"color: {{ accent }}\">—<\u002Fspan> Support &amp; asset division<\u002Fli>\n          <li style=\"display: flex; gap: 10px; align-items: baseline\"><span style=\"color: {{ accent }}\">—<\u002Fspan> Separation agreements<\u002Fli>\n        <\u002Ful>\n      <\u002Farticle>\n    <\u002Fdiv>\n    <aside style=\"background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid rgba(180,83,9,0.45); border-left: 4px solid {{ accent }}; border-radius: 4px; padding: 36px 34px; display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap\">\n      <i data-lucide=\"git-merge\" style=\"width: 34px; height: 34px; color: #e8b06b; flex-shrink: 0; margin-top: 4px\"><\u002Fi>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 280px\">\n        <h3 style=\"font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; margin: 0; color: #f8fafc\">Where Family and Criminal Law Intersect<\u002Fh3>\n        <p style=\"font-size: 15.5px; line-height: 1.7; color: #cbd5e1; margin: 0; max-width: 78ch; text-wrap: pretty\">A separation that triggers allegations of domestic violence. A criminal charge that reshapes a parenting dispute. These overlapping cases are where most clients need two lawyers. Lawrence handles both files seamlessly and capably, under one integrated strategy.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACT -->\n<section id=\"contact\" style=\"padding: 96px 24px; background: #fbfaf8\">\n  <div class=\"contact-grid\" style=\"max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 1.4fr); gap: 56px; align-items: start\">\n    <div style=\"display: flex; flex-direction: column; gap: 22px\">\n      <span style=\"font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: {{ accent }}; font-weight: 700\">Contact<\u002Fspan>\n      <h2 style=\"font-family: 'Cormorant Garamond', serif; font-size: clamp(30px, 3.6vw, 42px); font-weight: 600; margin: 0; color: #0f172a; text-wrap: pretty\">Schedule a confidential consultation.<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.7; color: #475569; margin: 0; text-wrap: pretty\">Let's talk about your case. Reach out to discuss your situation, whether criminal, family, or both, and receive a candid assessment of your options.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #ffffff; border: 1px solid #e7e2d9; border-radius: 4px; padding: 40px 36px; box-shadow: 0 4px 20px rgba(15,23,42,0.06); display: flex; flex-direction: column; gap: 28px\">\n      <div style=\"display: flex; gap: 18px; align-items: flex-start\">\n        <div style=\"width: 46px; height: 46px; border-radius: 50%; background: #0f172a; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">\n          <i data-lucide=\"phone\" style=\"width: 20px; height: 20px; color: #e8b06b\"><\u002Fi>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 3px\">\n          <span style=\"font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #64748b; font-weight: 600\">Phone<\u002Fspan>\n          <a href=\"tel:+19057078686\" style=\"font-family: 'Cormorant Garamond', serif; font-size: 2
